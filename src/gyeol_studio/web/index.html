<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
  <title>결 스튜디오</title>
  <link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <a class="brand" href="#/"><img src="/static/img/icon.svg" alt="" width="28" height="28"><span>결 스튜디오</span></a>
      <div class="topbar-right">
        <button id="jobs-btn" class="jobs-btn" hidden aria-label="진행 중인 작업"></button>
        <a class="icon-btn" href="#/connect" title="휴대폰 연결" aria-label="휴대폰 연결" data-tour="connect">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="18" r="1.2" fill="currentColor"/></svg>
        </a>
        <button id="user-btn" class="user-btn" aria-label="사용자 바꾸기"></button>
      </div>
    </header>
    <nav class="sidenav" id="nav" aria-label="메뉴">
      <a href="#/" data-nav="library" data-tour="library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>곡 보관함</span></a>
      <a href="#/check" data-nav="check"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h3l2-6 4 12 2-6h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg><span>시작 검사</span></a>
      <a href="#/history" data-nav="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg><span>연습 기록</span></a>
      <a href="#/data" data-nav="data"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M4 12h16M4 17h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="18" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>데이터</span></a>
      <a href="#/training" data-nav="training"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M12 12l8-4.5M12 12v9M12 12L4 7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>학습</span></a>
      <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>설정</span></a>
    </nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="jobs-panel" class="jobs-panel" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
